<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PC &amp; Laptop Specialists — Repair Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  

  <main class="container page-content">
    <div class="page-header">
      <h1>PC &amp; Laptop Troubleshooting Specialists</h1>
      <p class="subtitle">Find verified engineers for hardware diagnostics, OS/BSOD fixes, MacBooks, and custom rigs.</p>
    </div>

    <!-- Search & Sort Controls -->
    <div class="card toolbar-card">
      <div class="toolbar-top">
        <input
          type="search"
          id="searchInput"
          class="input"
          placeholder="Search by specialist, issue (e.g. BSOD, SSD, MacBook, Motherboard)..."
        />
        <select id="sortSelect" class="input sort-select">
          <option value="rating">Sort: Highest Rated</option>
          <option value="price-asc">Sort: Visit Fee (Low to High)</option>
          <option value="reviews">Sort: Most Jobs Completed</option>
        </select>
      </div>

      <div class="chip-group" id="categoryFilters">
        <button type="button" class="chip active" data-category="All">All Specialists</button>
        <button type="button" class="chip" data-category="Hardware">Hardware &amp; Motherboard</button>
        <button type="button" class="chip" data-category="Software & OS">Software &amp; OS</button>
        <button type="button" class="chip" data-category="MacBook">MacBook</button>
        <button type="button" class="chip" data-category="Data & Storage">Data &amp; Storage</button>
        <button type="button" class="chip" data-category="Gaming & Desktop">Gaming &amp; Desktop</button>
      </div>
    </div>

    <p class="results-meta" id="resultsCount"></p>

    <!-- Specialists Grid -->
    <section id="specialistsGrid" class="specialists-grid"></section>
  </main>

  <script src="js/technicians-data.js"></script>
