<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - SkillConnect</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
.form-box{max-width:420px;margin:50px auto;background:#fff;padding:32px;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.12);}
.form-box h2{color:var(--dark);text-align:center;margin-bottom:20px;}
.form-box label{display:block;margin:12px 0 4px;font-weight:500;}
.form-box input,.form-box select{width:100%;padding:12px;border:1px solid #cfdcdc;border-radius:8px;font-family:inherit;font-size:15px;}
.form-box .btn{width:100%;margin-top:22px;}
.form-box p{text-align:center;margin-top:16px;}
.form-box a{color:var(--main);font-weight:600;}
</style>
</head>
<body>
<nav class="navbar">
  <a href="index.html" class="logo">Skill<span>Connect</span></a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="search.html">Search Problem</a></li>
    <li><a href="technicians.html">Technicians</a></li>
    <li><a href="login.html" class="active">Login</a></li>
  </ul>
</nav>

<div class="page-title"><h1>Register</h1></div>
  <h2>Create Account</h2>
  <form id="regForm">
    <label>Full Name</label>
    <input type="text" id="name" required>
    <label>Email</label>
    <input type="email" id="email" required>
    <label>Password (min 6 characters)</label>
    <input type="password" id="password" minlength="6" required>
    <label>Register as</label>
    <select id="role">
      <option value="Customer">Customer</option>
      <option value="Technician">Technician</option>
    </select>
    <button type="submit" class="btn">Register</button>
  </form>
  <p>Already have an account? <a href="login.html">Login</a></p>
</div>

<footer class="footer">&copy; 2026 SkillConnect | Group 43</footer>

<script>
document.getElementById('regForm').addEventListener('submit', function(e){
  e.preventDefault();
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim().toLowerCase();
  const password = document.getElementById('password').value;
  const role = document.getElementById('role').value;
  const users = JSON.parse(localStorage.getItem('users') || '[]');
  if (users.some(u => u.email === email)) {
    alert('This email is already registered.');
    return;
  }
  users.push({name, email, password, role});
  localStorage.setItem('users', JSON.stringify(users));
  alert('Registration successful! Please login.');
  location.href = 'login.html';
});
</script>
</body>
</html>
